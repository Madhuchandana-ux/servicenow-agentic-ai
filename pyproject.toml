[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "servicenow-agentic-ai"
version = "0.1.0"
description = "FAANG-ready ServiceNow Agentic AI Service Desk"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "sentence-transformers",
    "faiss-cpu",
    "streamlit",
    "requests",
    "python-dotenv",
    "joblib"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "types-requests"
]
